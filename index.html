<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BioAI Final System 💀🚀</title>

<link rel="stylesheet" href="style.css">
<script src="https://unpkg.com/ngl@latest/dist/ngl.js"></script>
</head>

<body>

<header>🧬 SRM BioAI System</header>

<div class="container">

<!-- BMI -->
<div class="card">
<h3>📊 Ultimate BMI Health System</h3>

<input id="height" placeholder="Height (cm)">
<input id="weight" placeholder="Weight (kg)">
<input id="ageBMI" placeholder="Age">

<select id="gender">
<option value="male">Male</option>
<option value="female">Female</option>
</select>

<button onclick="calcBMI()">Analyze</button>

<div id="bmiResult"></div>
<div id="bmiDetails"></div>
<div id="dietPlan"></div>
</div>

<!-- PROTEIN -->
<div class="card">
<h3>🧬 Protein Viewer</h3>

<select id="pdbSelect">
<option value="1CRN">Crambin</option>
<option value="4HHB">Hemoglobin</option>
<option value="1INS">Insulin</option>
<option value="1LYZ">Lysozyme</option>
<option value="6VSB">Spike Protein</option>
</select>

<input id="pdb" placeholder="Custom PDB ID">

<button onclick="loadProtein()">Load Protein</button>
<button onclick="toggleSpin()">Rotate</button>

<div id="viewer"></div>
<div id="proteinInfo"></div>
</div>

<!-- ALIGNMENT -->
<div class="card">
<h3>🧬 Sequence Alignment</h3>

<textarea id="seq1" placeholder="Sequence 1"></textarea>
<textarea id="seq2" placeholder="Sequence 2"></textarea>

<button onclick="alignSeq()">Align</button>

<pre id="alignOutput"></pre>
<div id="alignStats"></div>
</div>

</div>

<script src="script.js"></script>
</body>
                        </html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Bio Lab Ultimate Pro 💀🧬</title>

<link rel="stylesheet" href="style.css">
<script src="https://unpkg.com/ngl@latest/dist/ngl.js"></script>
</head>

<body>

<header>🧬 SRM Bio Lab</header>

<div class="container">

<!-- ================= BMI ================= -->
<div class="card">
<h3>📊 BMI + Health Analyzer</h3>

<input id="height" placeholder="Height (cm)">
<input id="weight" placeholder="Weight (kg)">
<input id="age" placeholder="Age">

<select id="gender">
<option value="male">Male</option>
<option value="female">Female</option>
</select>

<button onclick="calcBMI()">Analyze</button>

<div id="bmiOut"></div>
<div id="dietOut"></div>
</div>

<!-- ================= PROTEIN ================= -->
<div class="card">
<h3>🧬 Protein Explorer (ALL PDB)</h3>

<input id="pdbInput" placeholder="Enter PDB ID (e.g. 1CRN)">

<select id="proteinList">
<option value="1CRN">Crambin</option>
<option value="1INS">Insulin</option>
<option value="1LYZ">Lysozyme</option>
<option value="4HHB">Hemoglobin</option>
<option value="1MBN">Myoglobin</option>
<option value="3NIR">Cytochrome C</option>
<option value="1BNA">DNA Duplex</option>
<option value="1AKE">Adenylate Kinase</option>
<option value="1GFL">GFP</option>
<option value="6VSB">COVID Spike</option>
<option value="5XNL">CRISPR-Cas9</option>
<option value="3J3Q">Ribosome</option>
</select>

<select id="rep">
<option value="cartoon">Cartoon</option>
<option value="surface">Surface</option>
<option value="ball+stick">Ball+Stick</option>
<option value="spacefill">Spacefill</option>
</select>

<button onclick="loadProtein()">Load Protein</button>
<button onclick="toggleSpin()">Rotate</button>
<button onclick="resetView()">Reset</button>
<button onclick="showLigand()">Ligands</button>
<button onclick="showActiveSite()">Active Site</button>

<div id="viewer"></div>
<div id="proteinInfo"></div>

</div>

</div>

<script src="script.js"></script>
</body>
</html>

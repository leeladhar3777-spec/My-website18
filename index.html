<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BioAI Ultimate 💀🚀</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://unpkg.com/ngl@latest/dist/ngl.js"></script>
</head>

<body>

<header>🧬 LEELADHAR BioAI System [SRM]</header>

<div class="container">

<!-- BMI -->
<div class="card">
<h3>📊 BMI + Diet</h3>
<input id="height" placeholder="Height (m)">
<input id="weight" placeholder="Weight (kg)">
<button onclick="calcBMI()">Analyze</button>
<p id="bmiResult"></p>
<div id="dietPlan"></div>
</div>

<!-- AI Health -->
<div class="card">
<h3>🤖 AI Health Assistant</h3>
<input id="ageAI" placeholder="Age">
<input id="symptomsAI" placeholder="Symptoms">

<button onclick="runAI()">Analyze</button>
<div id="aiReport"></div>

<hr>

<button onclick="startChat()">Start Chat</button>
<div id="aiChat"></div>
<input id="chatInputAI">
<button onclick="nextChat(chatInputAI.value)">Send</button>
</div>

<!-- Protein -->
<div class="card">
<h3>🧬 Protein Analyzer</h3>

<select id="pdbSelect">
<option value="1BNA">DNA</option>
<option value="4HHB">Hemoglobin</option>
<option value="1INS">Insulin</option>
<option value="1LYZ">Lysozyme</option>
<option value="6VSB">COVID Spike</option>
</select>

<input id="pdb">

<button onclick="loadProtein()">Load</button>
<button onclick="analyzeStructure()">Analyze</button>

<div id="viewer"></div>
<div id="analysisPanel"></div>
</div>

<!-- Alignment -->
<div class="card">
<h3>🧬 Alignment Tool</h3>
<textarea id="seq1"></textarea>
<textarea id="seq2"></textarea>
<button onclick="alignSeq()">Align</button>
<pre id="alignOutput"></pre>
<div id="alignStats"></div>
</div>

</div>

<script src="script.js"></script>

</body>
</html>

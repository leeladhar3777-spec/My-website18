<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BioAI Ultimate 💀🚀</title>

<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://unpkg.com/ngl@latest/dist/ngl.js"></script>
</head>

<body>

<header>🧬 SRM BioAI System</header>

<div class="container">

<!-- BMI -->
<div class="card">
<h3>📊 Ultimate BMI Health System</h3>

<input id="height" placeholder="Height (cm)">
<input id="weight" placeholder="Weight (kg)">
<input id="ageBMI" placeholder="Age">

<select id="gender">
<option value="male">Male</option>
<option value="female">Female</option>
</select>

<button onclick="calcBMI()">Analyze</button>

<div id="bmiResult"></div>
<div id="bmiDetails"></div>
<div id="dietPlan"></div>
</div>

<!--

<!-- PROTEIN -->
<div class="card">
<h3>🧬 Protein Analyzer</h3>

<select id="pdbSelect">
<option value="1BNA">DNA</option>
<option value="4HHB">Hemoglobin</option>
<option value="1INS">Insulin</option>
<option value="1LYZ">Lysozyme</option>
<option value="6VSB">COVID Spike</option>
</select>

<input id="pdb" placeholder="Custom PDB ID">

<select id="representation">
<option value="cartoon">Cartoon</option>
<option value="surface">Surface</option>
<option value="ball+stick">Ball+Stick</option>
</select>

<select id="colorScheme">
<option value="chainname">Chain</option>
<option value="element">Element</option>
<option value="residueindex">Rainbow</option>
</select>

<button onclick="loadProtein()">Load</button>
<button onclick="toggleSpin()">Rotate</button>
<button onclick="highlightLigand()">Ligand</button>
<button onclick="highlightActiveSite()">Active Site</button>
<button onclick="analyzeStructure()">Analyze</button>

<div id="viewer"></div>
<div id="analysisPanel"></div>
<div id="infoPanel"></div>
</div>

<!-- ALIGNMENT -->
<div class="card">
<h3>🧬 Alignment PRO</h3>
<textarea id="seq1"></textarea>
<textarea id="seq2"></textarea>
<button onclick="alignSeq()">Align</button>
<pre id="alignOutput"></pre>
<div id="alignStats"></div>
</div>

</div>

<script src="script.js"></script>
</body>
</html>
